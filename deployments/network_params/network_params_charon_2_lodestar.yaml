participants:
  # 0) vanilla validator (always kept — bootstraps/keeps the chain alive)
  - el_type: geth
    el_image: ethereum/client-go:v1.17.4
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.2.0
    use_separate_vc: true
    vc_type: lighthouse
    vc_image: sigp/lighthouse:v8.2.0
    count: 2
    supernode: true

  # 2) lodestar / charon / lodestar
  - el_type: geth
    el_image: ethereum/client-go:v1.17.4
    cl_type: lodestar
    cl_image: chainsafe/lodestar:v1.41.1
    supernode: true
    use_separate_vc: true
    vc_type: charon
    vc_image: obolnetwork/charon:v1.10.3
    charon_node_count: 3
    charon_params:
      charon_vc: lodestar
      charon_vc_image: chainsafe/lodestar:v1.41.1
    count: 1
network_params:
  network: kurtosis
  network_id: "3151908"
  deposit_contract_address: "0x4242424242424242424242424242424242424242"
  seconds_per_slot: 12
  num_validator_keys_per_node: 128
  preregistered_validator_keys_mnemonic: "giant issue aisle success illegal bike spike
    question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy
    very lucky have athlete"
  shard_committee_period: 1
  prefunded_accounts: '{"0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "100000ETH"}}'
wait_for_finalization: false
global_log_level: info
parallel_keystore_generation: false
mev_type: flashbots
mev_params:
  mev_builder_subsidy: 1
prometheus_params:
  remote_write_url: "https://vm.monitoring.gcp.obol.tech/write"
  remote_write_token: "$PROMETHEUS_REMOTE_WRITE_TOKEN"
  remote_write_relabel_configs:
    - SourceLabels: ["job"]
      Regex: ".*charon.*"
      Action: keep
    - SourceLabels: ["client_name"]
      Regex: "charon"
      TargetLabel: job
      Replacement: charon
      Action: replace
additional_services:
  - spamoor
  - prometheus
