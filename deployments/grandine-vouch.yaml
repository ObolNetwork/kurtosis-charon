participants:
  - el_type: geth
    el_image: ethereum/client-go:v1.17.5
    cl_type: grandine
    cl_image: sifrai/grandine:2.0.6
    use_separate_vc: true
    vc_type: lighthouse
    vc_image: sigp/lighthouse:v8.2.1
    count: 2
    supernode: true

  - el_type: geth
    el_image: ethereum/client-go:v1.17.5
    cl_type: grandine
    cl_image: sifrai/grandine:2.0.6
    supernode: true
    use_separate_vc: true
    vc_type: charon
    vc_image: obolnetwork/charon:$CHARON_VERSION
    charon_node_count: 4
    charon_params:
      charon_vc: vouch
      charon_vc_image: attestant/vouch:1.13.1
    count: 1
network_params:
  network: kurtosis
  network_id: "3151908"
  deposit_contract_address: "0x4242424242424242424242424242424242424242"
  seconds_per_slot: 12
  num_validator_keys_per_node: 128
  preregistered_validator_keys_mnemonic: "giant issue aisle success illegal bike spike question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy very lucky have athlete"
  shard_committee_period: 1
  prefunded_accounts: '{"0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "100000ETH"}}'
wait_for_finalization: false
global_log_level: debug
parallel_keystore_generation: false
mev_type: mock
prometheus_params:
  storage_tsdb_retention_time: 3h
  remote_write_url: "https://vm.monitoring.gcp.obol.tech/write"
  remote_write_token: "$PROMETHEUS_REMOTE_WRITE_TOKEN"
  remote_write_relabel_configs:
    - SourceLabels: ["job"]
      Regex: ".*charon.*"
      Action: keep
    - SourceLabels: ["client_name"]
      Regex: "charon"
      TargetLabel: job
      Replacement: charon
      Action: replace
additional_services:
  - spamoor
  - prometheus
